name: Radar diário

# Varredura rápida das contratações com proposta ainda em aberto.
on:
  schedule:
    - cron: "0 9 * * 1-5"      # 06:00 em Brasília, dias úteis
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-licitacoes      # radar e histórico nunca escrevem na base ao mesmo tempo
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar propostas em aberto
        env:
          PYTHONPATH: src
        run: python -m licita radar

      - name: Recalcular métricas e exportar
        env:
          PYTHONPATH: src
        run: |
          python -m licita metricas
          python -m licita exportar

      - uses: actions/upload-artifact@v4
        with:
          name: painel
          path: dados/painel.html

      - name: Commitar base e exports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          git diff --staged --quiet || git commit -m "radar: coleta de $(date -u +%Y-%m-%d)"
          git push
