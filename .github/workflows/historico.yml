name: Histórico semanal

# Backfill incremental das contratações publicadas, com itens e resultados.
# É a varredura pesada; por isso roda semanalmente, não todo dia.
on:
  schedule:
    - cron: "0 7 * * 0"        # domingo, 04:00 em Brasília
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos de histórico a coletar (ignorado se 'desde' for informado)"
        required: false
        default: "3"
      municipio:
        description: "Restringe a municípios nomeados, separados por vírgula (nome ou IBGE). Vazio = todos"
        required: false
        default: ""
      desde:
        description: "Data inicial AAAA-MM-DD. Tem precedência sobre 'anos'"
        required: false
        default: ""
      ate:
        description: "Data final AAAA-MM-DD. Vazio = hoje"
        required: false
        default: ""
      atas:
        description: "Coletar também atas e contratos"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: coleta-licitacoes
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 330       # a varredura completa com detalhe é longa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes de regressão
        # O caso-âncora precisa continuar reproduzindo os números documentados
        # antes de qualquer coleta sobrescrever a base.
        run: python -m unittest discover -s tests -v

      # As entradas viram argumentos só quando preenchidas: --desde vazio faria
      # date.fromisoformat("") estourar, e --municipio vazio faria o filtro
      # procurar um município de nome em branco.
      #
      # Duas armadilhas do Actions evitadas aqui. A primeira: o shell roda com
      # `-e`, então `[ -n "$X" ] && VAR=...` derruba o passo quando X é vazio,
      # porque a linha inteira sai com status 1 — daí o `if` explícito. A
      # segunda: valores de entrada chegam por `env`, nunca interpolados dentro
      # do comando, que seria injeção de shell por quem dispara o workflow.
      - name: Coletar histórico
        env:
          PYTHONPATH: src
          ANOS: ${{ inputs.anos || '3' }}
          MUNICIPIO: ${{ inputs.municipio }}
          DESDE: ${{ inputs.desde }}
          ATE: ${{ inputs.ate }}
        run: |
          args=()
          if [ -n "$DESDE" ]; then args+=(--desde "$DESDE"); else args+=(--anos "$ANOS"); fi
          if [ -n "$ATE" ]; then args+=(--ate "$ATE"); fi
          if [ -n "$MUNICIPIO" ]; then args+=(--municipio "$MUNICIPIO"); fi
          printf 'coleta: %s\n' "${args[*]}"
          python -m licita historico "${args[@]}"

      - name: Coletar atas e contratos
        if: inputs.atas
        env:
          PYTHONPATH: src
          ANOS: ${{ inputs.anos || '3' }}
          MUNICIPIO: ${{ inputs.municipio }}
          DESDE: ${{ inputs.desde }}
          ATE: ${{ inputs.ate }}
        run: |
          args=()
          if [ -n "$DESDE" ]; then args+=(--desde "$DESDE"); else args+=(--anos "$ANOS"); fi
          if [ -n "$ATE" ]; then args+=(--ate "$ATE"); fi
          if [ -n "$MUNICIPIO" ]; then args+=(--municipio "$MUNICIPIO"); fi
          python -m licita atas "${args[@]}"

      - name: Métricas e exports
        env:
          PYTHONPATH: src
        run: |
          python -m licita metricas
          python -m licita exportar

      - uses: actions/upload-artifact@v4
        with:
          name: base-e-exports
          path: |
            dados/painel.html
            dados/*.csv
            dados/licitacoes.xlsx
            dados/licitacoes.db

      - name: Commitar base e exports
        # A coleta pode levar horas (paginação real do PNCP); o branch pode
        # ter recebido outro commit nesse meio-tempo. `git pull --rebase`
        # antes do push evita o "rejected (fetch first)" sem reescrever
        # histórico alheio — só reaplica este commit por cima do que chegou.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          git diff --staged --quiet || git commit -m "histórico: coleta de $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
