# Endpoints e parâmetros de coleta.
#
# AVISO: nenhum destes endpoints pôde ser validado ao vivo no ambiente onde este
# código foi escrito (política de egress bloqueia todo host .gov.br). As definições
# vêm da documentação oficial do PNCP e de implementações de terceiros.
# Rode `python -m licita probe` antes de confiar em qualquer um deles.

http:
  timeout_s: 45
  max_tentativas: 5
  backoff_base_s: 2.0        # espera = backoff_base * 2**(tentativa-1), com jitter
  backoff_teto_s: 60.0
  retry_after_teto_s: 120.0  # teto para o Retry-After enviado pelo servidor
  pausa_entre_chamadas_s: 0.35   # piso do ritmo; o freio adaptativo só sobe daqui
  pausa_teto_s: 8.0          # até onde o freio pode subir depois de 429 seguidos
  sucessos_para_afrouxar: 20 # sucessos seguidos antes de aliviar o freio
  user_agent: "base-licitacoes-jales/0.1 (pesquisa de mercado; contato via repositorio)"
  cache_ttl_h: 12            # respostas ficam em cache local por este período

# Orçamento de retry para varredura em massa e sondas de diagnóstico.
# O perfil acima é generoso porque uma sonda de endpoint precisa de veredito
# confiável: declarar endpoint quebrado por causa de uma lentidão passageira é
# falso negativo na pergunta mais importante da Fase 0.
# Numa varredura de centenas de requisições a lógica se inverte — insistir é o
# erro. Com o perfil generoso, UMA requisição travada custa 5x45s de timeout
# mais 30s de backoff: 4,2 minutos. Dez delas consomem 42 minutos.
# Aqui, requisição lenta é falha: registra no relatório e segue.
# O PNCP NÃO documenta rate limit — nem o Manual das APIs de Consultas nem o
# Manual de Integração citam limite ou HTTP 429. O que existe é medição: a
# varredura de 2026-08-24 usou 0,35s de pausa e tomou 103 respostas
# "Limite de requisições excedido" em 29 municípios. O valor abaixo é provisório
# até a sonda `medir_ritmo` reportar a pausa sustentável medida; a única
# recomendação pública encontrada fala em ao menos 1s entre chamadas.
http_massa:
  timeout_s: 15
  max_tentativas: 3
  backoff_base_s: 1.5
  backoff_teto_s: 10.0
  retry_after_teto_s: 120.0
  pausa_entre_chamadas_s: 1.0
  pausa_teto_s: 8.0
  sucessos_para_afrouxar: 30
  user_agent: "base-licitacoes-jales/0.1 (pesquisa de mercado; contato via repositorio)"
  cache_ttl_h: 12

# Sondagem de fonte candidata (`python -m licita fontes`). Orçamento próprio
# porque o cálculo aqui é outro: são 14 checagens contra hosts que podem
# simplesmente não existir. Com o perfil `http`, uma checagem contra host morto
# custa 5x45s de timeout mais backoff — quase 5 minutos cada, quase uma hora no
# total, para descobrir o que 2 tentativas já dizem. Host que não responde em
# duas tentativas entra no relatório como INCONCLUSIVO, e o relatório manda
# repetir a medição em vez de tratar isso como veredito sobre a fonte.
http_sonda:
  timeout_s: 20
  max_tentativas: 2
  backoff_base_s: 2.0
  backoff_teto_s: 8.0
  retry_after_teto_s: 60.0
  pausa_entre_chamadas_s: 1.0
  pausa_teto_s: 8.0
  sucessos_para_afrouxar: 10
  user_agent: "base-licitacoes-jales/0.1 (pesquisa de mercado; contato via repositorio)"
  cache_ttl_h: 12

ibge:
  base: "https://servicodados.ibge.gov.br/api/v1/localidades"
  municipios_por_uf: "/estados/{uf}/municipios"

pncp:
  # API pública de consulta. Não exige autenticação.
  consulta_base: "https://pncp.gov.br/api/consulta"
  contratacoes_publicacao: "/v1/contratacoes/publicacao"
  contratacoes_proposta: "/v1/contratacoes/proposta"
  atas: "/v1/atas"
  contratos: "/v1/contratos"

  # API de detalhe. Leitura pública, porém MENOS confirmada que a de consulta —
  # o probe valida antes de o coletor depender dela.
  detalhe_base: "https://pncp.gov.br/api/pncp/v1"
  itens: "/orgaos/{cnpj}/compras/{ano}/{sequencial}/itens"
  resultados: "/orgaos/{cnpj}/compras/{ano}/{sequencial}/itens/{item}/resultados"
  arquivos: "/orgaos/{cnpj}/compras/{ano}/{sequencial}/arquivos"

  # `tamanhoPagina` tem limite POR ENDPOINT, não um valor único — foi o que
  # quebrou a primeira varredura real: 500 aplicado a /contratacoes/publicacao
  # devolve HTTP 422, e as 851 requisições voltaram vazias.
  # DIVERGÊNCIA REGISTRADA: o Manual das APIs de Consultas v1.0 dá 500 como
  # máximo para TODOS os endpoints. A sonda `descobrir_tamanho_pagina`, contra a
  # API viva em 2026-08-24, mediu HTTP 400 para 100 e para 500 em
  # /contratacoes/publicacao. Vale a medição, não o manual — mas as duas ficam
  # registradas aqui para que ninguém "corrija" isto de volta lendo só a doc.
  tamanho_pagina:
    contratacoes_publicacao: 50
    contratacoes_proposta: 50
    atas: 500
    contratos: 500
    # Começo conservador: a distribuição de itens por contratação secava em 10
    # porque a coleta nem paginava (ver src/licita/pncp.py:itens). Nenhuma
    # sonda mediu o teto real de /itens ainda — 50 é o mesmo piso usado nas
    # rotas de consulta antes de a sonda de 2026-08-24 medir o teto delas.
    itens: 50
    padrao: 50               # usado por endpoint sem limite conhecido
  # A modalidade é parâmetro obrigatório em /contratacoes/publicacao, por isso a
  # coleta itera sobre esta lista. Ver tabela de domínio abaixo.
  modalidades:
    - 5    # Concorrência - Presencial
    - 6    # Pregão - Eletrônico
    - 7    # Pregão - Presencial   <- padrão dos municípios pequenos da região
    - 8    # Dispensa de Licitação
    - 9    # Inexigibilidade
    - 12   # Credenciamento
  # Tamanho da janela de datas por requisição.
  # Medido pela sonda `descobrir_janela` em 2026-08-24: a API aceitou 365 dias.
  # Era 90 por precaução, o que quadruplicava o número de requisições.
  janela_dias: 365

coleta:
  # Backfill histórico: quantos anos para trás varrer na primeira execução.
  anos_historico: 3
  # O radar diário olha contratações com proposta em aberto neste horizonte.
  radar_horizonte_dias: 60

# --- Tabelas de domínio do PNCP (referência; não editar sem checar a fonte) ---

dominios:
  modalidade:
    1: "Leilão - Eletrônico"
    2: "Diálogo Competitivo"
    3: "Concurso"
    4: "Concorrência - Eletrônica"
    5: "Concorrência - Presencial"
    6: "Pregão - Eletrônico"
    7: "Pregão - Presencial"
    8: "Dispensa de Licitação"
    9: "Inexigibilidade"
    10: "Manifestação de Interesse"
    11: "Pré-qualificação"
    12: "Credenciamento"
    13: "Leilão - Presencial"
  situacao_contratacao:
    1: "Divulgada no PNCP"
    2: "Revogada"
    3: "Anulada"
    4: "Suspensa"
  situacao_item:
    1: "Em Andamento"
    2: "Homologado"
    3: "Anulado/Revogado/Cancelado"
    4: "Deserto"       # ninguém apareceu — sinal mais forte de vácuo competitivo
    5: "Fracassado"    # apareceram, mas todos inabilitados

# Modalidades consideradas presenciais, para o filtro "presencial vs eletrônico".
modalidades_presenciais: [5, 7, 13]

# Modalidades que costumam abrigar serviço técnico especializado.
modalidades_servico_tecnico: [8, 9, 12]

# Modalidades em que existe DISPUTA DE PREÇO entre licitantes.
#
# Medido em Santa Fé do Sul, 25/07 a 24/08/2026, contra a API real: em dispensa,
# 271 de 275 itens têm deságio EXATAMENTE zero, e em inexigibilidade 2 de 2.
# Não é vácuo competitivo — é que não houve disputa nenhuma. Nessas modalidades
# o "valor estimado" publicado no PNCP é o próprio valor contratado.
#
# Importa porque "ausência de deságio" pesa 30% do Índice de Oportunidade. Sem
# esta separação, toda dispensa recebia nota máxima nesse componente, e como
# dispensa é 90% do volume da região, o índice inteiro viraria um medidor de
# "quanto o município usa dispensa" — que não é a pergunta do projeto.
modalidades_com_disputa: [1, 2, 3, 4, 5, 6, 7, 13]

# Situações de item que dizem algo sobre CONCORRÊNCIA. Só estas três:
#   2 homologado -> alguém apareceu e venceu
#   4 deserto    -> ninguém apareceu
#   5 fracassado -> apareceram e todos foram inabilitados
#
# Ficam de fora, e o motivo é o mesmo nos dois casos — ausência de medida sendo
# lida como medida de ausência:
#   1 Em Andamento -> ainda em curso; não é prova de que ninguém apareceu
#   3 Anulado/Revogado/Cancelado -> o processo morreu antes do desfecho
#
# Medido em Santa Fé do Sul: combustível e laticínios só tinham item em
# andamento, e vigilância em saúde só tinha item cancelado. Os três recebiam
# deserção 0,0 e, sem nenhum outro componente, índice 0,0 — que se lê como
# "sem oportunidade" quando significa "ainda sem medida".
situacoes_item_concluidas: [2, 4, 5]
