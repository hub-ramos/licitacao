# Taxonomia de segmentos.
#
# Cada item de licitação é classificado em um segmento por três sinais, nesta ordem
# de precedência (ver src/licita/segmentar.py):
#   1. grupo CATMAT/CATSER, quando o órgão preencheu — é o sinal mais confiável
#   2. palavras-chave na descrição do item
#   3. palavras-chave no objeto da contratação, quando o item não tem descrição útil
#
# Campos de cada segmento:
#   tipo       produto | servico   -> a divisão econômica central do projeto
#   dominio    agrupamento temático usado nos filtros do painel
#   aderencia  alta | media | baixa | bloqueado  -> prioridade de análise no projeto
#   palavras   termos SEM acento e em minúsculas; casam por PALAVRA INTEIRA na
#              descrição normalizada, tolerando plural (a normalização remove
#              acentos e baixa a caixa). Não é substring: "cimento" não casa
#              dentro de "licenciamento" — ver src/licita/segmentar.py
#   excluir    termos que, se presentes, vetam o segmento (desambiguação)
#   catmat / catser  prefixos de grupo do catálogo federal
#   nota       por que este segmento importa; aparece no painel como tooltip

# ---------------------------------------------------------------------------
# SERVIÇOS TÉCNICOS EM SAÚDE
# Municípios pequenos compram serviço técnico por dispensa, inexigibilidade
# (art. 74, III — serviço técnico de natureza predominantemente intelectual)
# e credenciamento, não por pregão.
# ---------------------------------------------------------------------------

