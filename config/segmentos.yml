servico_capacitacao_saude:
  tipo: servico
  dominio: saude
  aderencia: alta
  nota: "Capacitação e educação permanente de profissionais da rede municipal."
  # As palavras isoladas `capacitacao`, `treinamento`, `educacao permanente` e
  # `curso de formacao` foram REMOVIDAS. Medido na Fase 0 de 2026-08-24: das 26
  # contratações classificadas como serviço de saúde, 19 vieram destas quatro —
  # munição da Guarda Civil, Libras, LOA, gestão patrimonial, EMPRETEC,
  # certificação RPPS, congresso de educação. Todo contrato de software também
  # cita "implantação e treinamento". Qualquer termo aqui precisa carregar o
  # contexto de saúde dentro de si; se não carregar, ele não pertence a este
  # segmento. O preço disto é falso negativo em edital que só diz "capacitação"
  # e revela a área no anexo — aceito conscientemente: mercado superestimado por
  # falso positivo é pior que mercado subestimado.
  palavras:
    - capacitacao em saude
    - capacitacao na area da saude
    - capacitacao de profissionais de saude
    - capacitacao de agentes comunitarios
    - capacitacao de agentes de saude
    - capacitacao de agentes de endemias
    - capacitacao em vigilancia
    - capacitacao em vigilancia em saude
    - capacitacao em biosseguranca
    - capacitacao em imunizacao
    - capacitacao em atencao basica
    - capacitacao em atencao primaria
    - capacitacao em saude mental
    - capacitacao em enfermagem
    - capacitacao em e sus
    - capacitacao no e sus
    - capacitacao em telessaude
    - treinamento em saude
    - treinamento de profissionais de saude
    - treinamento em biosseguranca
    - educacao permanente em saude
    - educacao permanente dos profissionais de saude
    - educacao continuada em saude
    - educacao continuada em enfermagem
    - curso de formacao em saude
    - teleducacao em saude
    - teleducacao
    - suporte basico de vida
    - suporte avancado de vida
    - primeiros socorros
  excluir:
    - capacitacao de servidores em licitacao
    - treinamento de brigada
    - gestao patrimonial
    - guarda civil
    - lei orcamentaria anual
    - lei de diretrizes orcamentarias
    - lingua brasileira de sinais
    - libras
    - educacao especial
    - educacao inclusiva
    - empretec
    - certificacao profissional rpps
    - regime proprio de previdencia
    - processos administrativos

