<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de Licitações — Microrregião de Jales</title>
<style>
:root{
  --fundo:#f6f7f9; --painel:#fff; --borda:#dfe3e8; --texto:#16202c; --suave:#5b6b7c;
  --acento:#1f6f8b; --acento-fraco:#e6f0f4;
  --quente:#b3401f; --morno:#c07a12; --frio:#2f7a4f;
  --sombra:0 1px 3px rgba(16,32,48,.08);
}
/* Três estados de tema, não dois: o visitante pode não ter escolhido nada
   (só prefers-color-scheme decide) ou ter escolhido explicitamente. O guard
   :not([data-theme=light]) faz a escolha explícita ganhar do sistema. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --fundo:#11161c; --painel:#19212a; --borda:#2b3742; --texto:#e6ecf2; --suave:#93a4b5;
    --acento:#5fb3d4; --acento-fraco:#1d2c36;
    --quente:#e8734a; --morno:#e0a83c; --frio:#5fbe8a;
    --sombra:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme=dark]{
  --fundo:#11161c; --painel:#19212a; --borda:#2b3742; --texto:#e6ecf2; --suave:#93a4b5;
  --acento:#5fb3d4; --acento-fraco:#1d2c36;
  --quente:#e8734a; --morno:#e0a83c; --frio:#5fbe8a;
  --sombra:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--painel);border-bottom:1px solid var(--borda);padding:14px 18px}
h1{margin:0;font-size:17px;letter-spacing:-.2px}
.sub{color:var(--suave);font-size:12.5px;margin-top:3px}
.totais{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.total b{display:block;font-size:18px;line-height:1.2}
.total span{color:var(--suave);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
nav{display:flex;gap:4px;padding:10px 18px 0;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;border-bottom:none;color:var(--suave);
  padding:8px 14px;border-radius:7px 7px 0 0;cursor:pointer;font-size:14px;font-weight:500}
nav button[aria-selected=true]{background:var(--painel);border-color:var(--borda);color:var(--texto)}
main{padding:0 18px 40px}
.caixa{background:var(--painel);border:1px solid var(--borda);border-radius:0 8px 8px 8px;
  box-shadow:var(--sombra);padding:14px}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:14px}
label{display:block;font-size:11.5px;color:var(--suave);margin-bottom:3px;
  text-transform:uppercase;letter-spacing:.4px}
select,input{width:100%;padding:7px 8px;border:1px solid var(--borda);border-radius:6px;
  background:var(--fundo);color:var(--texto);font-size:13.5px}
.acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.acoes button{padding:7px 12px;border:1px solid var(--borda);border-radius:6px;
  background:var(--fundo);color:var(--texto);cursor:pointer;font-size:13px}
.contagem{color:var(--suave);font-size:13px}
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--borda);
  white-space:nowrap;vertical-align:top}
th{position:sticky;top:0;background:var(--painel);cursor:pointer;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--suave);z-index:1}
th:hover{color:var(--texto)}
tbody tr:hover{background:var(--acento-fraco)}
td.larga{white-space:normal;min-width:290px;max-width:430px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.etq{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
  border:1px solid var(--borda);color:var(--suave)}
.etq.quente{color:var(--quente);border-color:var(--quente)}
.etq.morno{color:var(--morno);border-color:var(--morno)}
.etq.frio{color:var(--frio);border-color:var(--frio)}
.etq.saude{color:var(--acento);border-color:var(--acento)}
.barra{display:inline-block;height:7px;border-radius:4px;background:var(--acento);vertical-align:middle}
.vazio{padding:40px;text-align:center;color:var(--suave)}
/* Linha expansível: um mecanismo, dois usos (itens da contratação no Radar,
   itens do segmento×município×ano no Mapa de concorrência). O indicador vai
   na primeira célula porque é onde o olho já pousa ao ler a linha. */
tr.expansivel{cursor:pointer}
tr.expansivel td:first-child{position:relative;padding-left:20px}
tr.expansivel td:first-child::before{content:"▸";position:absolute;left:6px;
  color:var(--suave);font-size:10px}
tr.expansivel.aberta td:first-child::before{content:"▾";color:var(--acento)}
tr.expansivel.aberta{background:var(--acento-fraco)}
.linha-detalhe td{padding:10px 14px;background:var(--fundo)}
table.detalhe{width:100%;font-size:12.5px;border-collapse:collapse}
table.detalhe th{position:static;background:transparent;padding:5px 8px;
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;
  color:var(--suave);white-space:nowrap}
table.detalhe td{padding:5px 8px;white-space:normal;border-bottom:1px solid var(--borda)}
table.detalhe tr:last-child td{border-bottom:none}
.vazio-detalhe{padding:6px 8px;color:var(--suave);font-size:12.5px}
.detalhe-cabecalho{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:0 8px 8px}
.detalhe-cabecalho .busca-itens{flex:1 1 220px;min-width:180px;padding:6px 8px;
  border:1px solid var(--borda);border-radius:6px;background:var(--painel);
  color:var(--texto);font-size:12.5px}
.detalhe-contagem{color:var(--suave);font-size:11.5px;white-space:nowrap}
.paginacao-detalhe{display:flex;gap:10px;align-items:center;justify-content:center;
  padding:8px;font-size:12px;color:var(--suave)}
.paginacao-detalhe .pag-btn{padding:4px 10px;border:1px solid var(--borda);
  border-radius:6px;background:var(--painel);color:var(--texto);cursor:pointer;
  font-size:12px}
.paginacao-detalhe .pag-btn:disabled{opacity:.4;cursor:default}

/* Glossário: title nativo (hover, desktop) + botão "?" clicável (toque,
   celular — title sozinho não funciona em touch) em cabeçalhos e rótulos de
   filtro que tenham entrada em GLOSSARIO. */
.ajuda-wrap{position:relative;display:inline-block;margin-left:3px}
.ajuda{width:14px;height:14px;line-height:12px;padding:0;border-radius:50%;
  border:1px solid var(--suave);color:var(--suave);background:transparent;
  font-size:10px;cursor:pointer;vertical-align:middle;text-transform:none}
.ajuda:hover{color:var(--texto);border-color:var(--texto)}
.ajuda-bolha{display:none;position:absolute;top:120%;left:0;z-index:5;
  width:220px;max-width:60vw;background:var(--painel);border:1px solid var(--borda);
  border-radius:6px;box-shadow:var(--sombra);padding:8px 10px;font-size:12px;
  font-weight:400;text-transform:none;letter-spacing:normal;color:var(--texto);
  white-space:normal;cursor:default}
.ajuda-bolha.mostrar{display:block}

header{position:relative}
.glossario-abrir{position:absolute;top:14px;right:18px;padding:6px 12px;
  border:1px solid var(--borda);border-radius:20px;background:var(--painel);
  color:var(--suave);cursor:pointer;font-size:12.5px}
.glossario-abrir:hover{color:var(--texto);border-color:var(--acento)}
.glossario-painel{position:fixed;top:0;right:0;bottom:0;width:min(340px,90vw);
  background:var(--painel);border-left:1px solid var(--borda);box-shadow:var(--sombra);
  z-index:20;overflow-y:auto;padding:14px}
.glossario-topo{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;font-size:14px}
.glossario-topo button{border:none;background:none;color:var(--suave);
  cursor:pointer;font-size:15px;padding:2px 6px}
#glossario-lista{margin:0}
#glossario-lista dt{font-weight:600;font-size:13px;margin-top:12px}
#glossario-lista dt:first-child{margin-top:0}
#glossario-lista dd{margin:3px 0 0;color:var(--suave);font-size:12.5px;line-height:1.5}
.aviso{background:var(--acento-fraco);border-left:3px solid var(--acento);
  padding:10px 12px;border-radius:0 6px 6px 0;font-size:13px;margin-bottom:14px;color:var(--texto)}
a{color:var(--acento)}
@media(max-width:620px){
  main{padding:0 10px 30px} header{padding:12px 10px} nav{padding:8px 10px 0}
  td.larga{min-width:200px}
  .glossario-abrir{position:static;margin-top:8px}
}
</style>
</head>
<body>
<header>
  <h1>Radar de Licitações — Microrregião de Jales</h1>
  <div class="sub" id="carimbo"></div>
  <div class="totais" id="totais"></div>
  <button type="button" id="glossario-abrir" class="glossario-abrir">❔ Glossário</button>
</header>

<div id="glossario-painel" class="glossario-painel" hidden>
  <div class="glossario-topo">
    <strong>Glossário</strong>
    <button type="button" id="glossario-fechar" aria-label="Fechar glossário">✕</button>
  </div>
  <dl id="glossario-lista"></dl>
</div>

<nav id="abas">
  <button data-aba="radar" aria-selected="true">Radar — proposta aberta</button>
  <button data-aba="itens" aria-selected="false">Histórico de preços</button>
  <button data-aba="metricas" aria-selected="false">Mapa de concorrência</button>
  <button data-aba="vencedores" aria-selected="false">Vencedores</button>
</nav>

<main>
  <div class="caixa">
    <div id="aviso" class="aviso" hidden></div>
    <div class="filtros" id="filtros"></div>
    <div class="acoes">
      <button id="limpar">Limpar filtros</button>
      <button id="baixar">Baixar CSV do que está filtrado</button>
      <span class="contagem" id="contagem"></span>
    </div>
    <div class="rolagem"><table><thead id="cabecalho"></thead><tbody id="corpo"></tbody></table></div>
    <div class="vazio" id="vazio" hidden>Nenhum registro corresponde aos filtros.</div>
  </div>
</main>

<script id="dados" type="application/json">/*__DADOS__*/null</script>
<script>
"use strict";

const D = JSON.parse(document.getElementById("dados").textContent) || {};
const NADA = "—";

/* ---------------------------------------------------------------- formato */
const brl = v => (v === null || v === undefined || v === "")
  ? NADA
  : Number(v).toLocaleString("pt-BR", {style:"currency", currency:"BRL", maximumFractionDigits:2});
const pct = v => (v === null || v === undefined || v === "")
  ? NADA : (Number(v) * 100).toFixed(1).replace(".", ",") + "%";
const nums = v => (v === null || v === undefined || v === "")
  ? NADA : Number(v).toLocaleString("pt-BR");
const dia = v => {
  if (!v) return NADA;
  const d = String(v).slice(0, 10).split("-");
  return d.length === 3 ? `${d[2]}/${d[1]}/${d[0]}` : v;
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Dias até o encerramento — o que decide se dá tempo de participar. */
function prazo(v){
  if (!v) return null;
  const alvo = new Date(String(v).slice(0,10) + "T00:00:00");
  if (isNaN(alvo)) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  return Math.round((alvo - hoje) / 86400000);
}

/* Índice de oportunidade: quanto maior, maior o vácuo competitivo. */
function etqIndice(v){
  if (v === null || v === undefined) return `<span class="etq">${NADA}</span>`;
  const n = Number(v);
  const classe = n >= 60 ? "quente" : n >= 35 ? "morno" : "frio";
  const larg = Math.max(4, Math.round(n * 0.42));
  return `<span class="barra" style="width:${larg}px"></span> `
       + `<span class="etq ${classe}">${n.toFixed(0)}</span>`;
}

/* -------------------------------------------------------------- glossário */
/* GLOSSARIO[campo] = {termo, explicacao}. Quando `campo` bate com o `campo`
   de uma coluna ou de um filtro, o cabeçalho ganha title nativo (funciona só
   no hover, então só ajuda no desktop) mais um "?" clicável (funciona em
   toque, que é o uso principal do painel). */
const GLOSSARIO = D.glossario || {};

function termoAjudaHtml(chave){
  const entrada = GLOSSARIO[chave];
  if (!entrada) return "";
  return ` <span class="ajuda-wrap">`
       + `<button type="button" class="ajuda" title="${esc(entrada.explicacao)}" `
       + `aria-label="O que é ${esc(entrada.termo)}?">?</button>`
       + `<span class="ajuda-bolha">${esc(entrada.explicacao)}</span></span>`;
}

/* Liga o clique dos botões "?" recém-criados dentro de `raiz`. Escopado ao
   nó que acabou de ser (re)desenhado — ligar no document inteiro a cada
   redesenho duplicaria o listener nos botões que não mudaram. */
function ligarAjudaBotoes(raiz){
  raiz.querySelectorAll(".ajuda").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();   // não deixa o clique "vazar" pro <th> (ordenaria a coluna)
      const bolha = btn.nextElementSibling;
      const jaAberta = bolha.classList.contains("mostrar");
      document.querySelectorAll(".ajuda-bolha.mostrar").forEach(b => b.classList.remove("mostrar"));
      if (!jaAberta) bolha.classList.add("mostrar");
    });
  });
}

document.addEventListener("click", e => {
  if (!e.target.closest(".ajuda-wrap")){
    document.querySelectorAll(".ajuda-bolha.mostrar").forEach(b => b.classList.remove("mostrar"));
  }
});

/* ------------------------------------------------------- índice de itens */
/* Montado uma vez na carga, não a cada clique: EXPORTS["itens"] já traz tudo,
   nenhum dado novo precisa ser embarcado para a linha expansível funcionar. */
const ITENS = D.itens || [];
const IDX_POR_CONTRATACAO = new Map();
const IDX_POR_SEG_MUN_ANO = new Map();
ITENS.forEach(it => {
  const porContratacao = it.numero_controle_pncp;
  if (!IDX_POR_CONTRATACAO.has(porContratacao)) IDX_POR_CONTRATACAO.set(porContratacao, []);
  IDX_POR_CONTRATACAO.get(porContratacao).push(it);

  const porSegMunAno = `${it.codigo_ibge}|${it.segmento}|${it.ano}`;
  if (!IDX_POR_SEG_MUN_ANO.has(porSegMunAno)) IDX_POR_SEG_MUN_ANO.set(porSegMunAno, []);
  IDX_POR_SEG_MUN_ANO.get(porSegMunAno).push(it);
});

/* Tabela de itens que abre sob a linha clicada, com o vencedor e o link do
   PNCP daquele item — os três pedidos que motivaram a linha expansível. */
function tabelaDeItens(itens, vazioMsg){
  if (!itens || !itens.length)
    return `<div class="vazio-detalhe">${esc(vazioMsg || "Sem itens detalhados.")}</div>`;
  const linhas = itens.map(it => `<tr>
      <td class="num">${nums(it.numero_item)}</td>
      <td>${esc(it.descricao ?? NADA)}</td>
      <td>${esc(it.unidade_medida ?? NADA)}</td>
      <td class="num">${nums(it.quantidade)}</td>
      <td class="num">${brl(it.valor_unitario_estimado)}</td>
      <td class="num">${brl(it.valor_total_homologado_ajustado ?? it.valor_total_homologado)}</td>
      <td>${esc(it.situacao_item_nome ?? NADA)}</td>
      <td>${esc(it.nome_fornecedor ?? NADA)}</td>
      <td>${it.link_pncp
        ? `<a href="${esc(it.link_pncp)}" target="_blank" rel="noopener">edital</a>` : NADA}</td>
    </tr>`).join("");
  const tituloEstimado = GLOSSARIO.valor_unitario_estimado
    ? ` title="${esc(GLOSSARIO.valor_unitario_estimado.explicacao)}"` : "";
  const tituloTotal = GLOSSARIO.valor_total_homologado_ajustado
    ? ` title="${esc(GLOSSARIO.valor_total_homologado_ajustado.explicacao)}"` : "";
  return `<table class="detalhe"><thead><tr>
      <th>Nº</th><th>Descrição</th><th>Un.</th><th>Qtde</th>
      <th${tituloEstimado}>Unit. estimado${termoAjudaHtml("valor_unitario_estimado")}</th>
      <th${tituloTotal}>Total homologado${termoAjudaHtml("valor_total_homologado_ajustado")}</th>
      <th>Situação</th><th>Vencedor</th><th>Link</th>
    </tr></thead><tbody>${linhas}</tbody></table>`;
}

/* ------------------------------------------------- paginação + busca geral */
/* Estado de cada painel expandido: página atual e o texto de busca, por
   aba+linha. Persiste entre redesenhos para não perder a posição do usuário
   ao clicar em "avançar" ou digitar uma busca. */
const TAM_PAGINA_DETALHE = 10;
let detalheEstado = {};   // {aba: {chave: {pagina, busca}}}

function obterEstadoDetalhe(aba, chave){
  if (!detalheEstado[aba]) detalheEstado[aba] = {};
  if (!detalheEstado[aba][chave]) detalheEstado[aba][chave] = {pagina: 1, busca: ""};
  return detalheEstado[aba][chave];
}

/* Busca em TODOS os itens da base, não só nos da linha aberta — pedido
   explícito: um item pode estar noutra contratação/fornecedor e o usuário
   quer achá-lo sem fechar o que já está vendo. */
function buscarItensGeral(termo){
  const termos = termo.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!termos.length) return [];
  return ITENS.filter(it => {
    const alvo = `${it.descricao ?? ""} ${it.objeto ?? ""} ${it.nome_fornecedor ?? ""} `
               + `${it.municipio ?? ""} ${it.segmento ?? ""} ${it.numero_compra ?? ""}`
               .toLowerCase();
    return termos.every(t => alvo.includes(t));
  });
}

function paginacaoHtml(atual, total){
  return `<div class="paginacao-detalhe">
      <button type="button" class="pag-btn" data-dir="-1" ${atual <= 1 ? "disabled" : ""}>‹ Anterior</button>
      <span>Página ${atual} de ${total}</span>
      <button type="button" class="pag-btn" data-dir="1" ${atual >= total ? "disabled" : ""}>Avançar ›</button>
    </div>`;
}

/* Monta o conteúdo inteiro do painel expandido: busca + contagem + tabela +
   paginação. Chamada tanto no desenho completo da tabela quanto nas
   atualizações pontuais (digitar na busca, clicar em avançar). */
function renderizarDetalhe(cfg, aba, linha, chave){
  const est = obterEstadoDetalhe(aba, chave);
  const buscando = est.busca.trim().length > 0;
  const lista = buscando ? buscarItensGeral(est.busca) : cfg.expandir.itens(linha);

  const totalPaginas = Math.max(1, Math.ceil(lista.length / TAM_PAGINA_DETALHE));
  if (est.pagina > totalPaginas) est.pagina = totalPaginas;
  if (est.pagina < 1) est.pagina = 1;
  const inicio = (est.pagina - 1) * TAM_PAGINA_DETALHE;
  const pagina = lista.slice(inicio, inicio + TAM_PAGINA_DETALHE);

  const contagem = buscando
    ? `${lista.length.toLocaleString("pt-BR")} itens encontrados em toda a base`
    : `${lista.length.toLocaleString("pt-BR")} itens de ${cfg.expandir.escopoRotulo || "esta linha"}`;
  const vazioMsg = buscando ? "Nenhum item encontrado para esta busca." : "Sem itens detalhados.";

  return `<div class="detalhe-cabecalho">
      <input type="search" class="busca-itens" placeholder="Buscar em todos os itens da base…"
             value="${esc(est.busca)}">
      <span class="detalhe-contagem">${contagem}</span>
    </div>
    ${tabelaDeItens(pagina, vazioMsg)}
    ${totalPaginas > 1 ? paginacaoHtml(est.pagina, totalPaginas) : ""}`;
}

/* Substitui só o conteúdo do painel aberto (não a tabela inteira), para não
   perder o foco/cursor do campo de busca a cada tecla digitada. */
function atualizarBlocoDetalhe(cfg, aba, chave, tr){
  const linha = cfg.dados.find(r => String(cfg.expandir.chave(r)) === chave);
  if (!linha) return;
  const td = tr.querySelector("td");
  const ativo = document.activeElement;
  const eraBusca = ativo && ativo.classList && ativo.classList.contains("busca-itens") && tr.contains(ativo);
  const cursor = eraBusca ? ativo.selectionStart : null;

  td.innerHTML = renderizarDetalhe(cfg, aba, linha, chave);

  if (eraBusca){
    const novo = td.querySelector(".busca-itens");
    if (novo){
      novo.focus();
      if (cursor !== null){ try { novo.setSelectionRange(cursor, cursor); } catch {} }
    }
  }
  ligarEventosDetalhe(cfg, aba, chave, tr);
}

function ligarEventosDetalhe(cfg, aba, chave, tr){
  ligarAjudaBotoes(tr);   // "?" dos cabeçalhos "Unit. estimado" / "Total homologado"
  const busca = tr.querySelector(".busca-itens");
  if (busca){
    busca.addEventListener("input", e => {
      const est = obterEstadoDetalhe(aba, chave);
      est.busca = e.target.value;
      est.pagina = 1;
      atualizarBlocoDetalhe(cfg, aba, chave, tr);
    });
  }
  tr.querySelectorAll(".pag-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const est = obterEstadoDetalhe(aba, chave);
      est.pagina += Number(btn.dataset.dir);
      atualizarBlocoDetalhe(cfg, aba, chave, tr);
    });
  });
}

/* ----------------------------------------------------------------- abas */

  radar: {

/* --------------------------------------------------------- aba Vencedores */
const VENCEDOR_RAW = D.vencedores || [];
const AGRUPAMENTOS_VENCEDOR = [
  ["geral", "Geral"], ["segmento", "Por segmento"],
  ["mes", "Por mês/ano"], ["municipio", "Por município"]
];

/* Soma no cliente: um item ganho por linha em VENCEDOR_RAW vira um bucket por
   fornecedor + a dimensão escolhida. As contagens de segmentos/municípios
   distintos saem de Sets acumulados durante a soma, não de outra consulta. */
function agruparVencedores(modo){
  const buckets = new Map();
  VENCEDOR_RAW.forEach(r => {
    const dim = modo === "segmento" ? (r.segmento ?? NADA)
              : modo === "mes" ? `${r.ano ?? NADA}-${String(r.mes ?? 0).padStart(2, "0")}`
              : modo === "municipio" ? (r.municipio ?? NADA)
              : "";
    const chave = `${r.ni_fornecedor || NADA}::${dim}`;
    let b = buckets.get(chave);
    if (!b){
      b = {
        _chave: chave, _linhas: [],
        ni_fornecedor: r.ni_fornecedor, nome_fornecedor: r.nome_fornecedor,
        porte_fornecedor: r.porte_fornecedor,
        segmento: modo === "segmento" ? r.segmento : undefined,
        municipio: modo === "municipio" ? r.municipio : undefined,
        ano: modo === "mes" ? r.ano : undefined,
        mes: modo === "mes" ? r.mes : undefined,
        valor_total: 0, itens: 0,
        _contratacoes: new Set(), _segmentos: new Set(), _municipios: new Set()
      };
      buckets.set(chave, b);
    }
    b.valor_total += Number(r.valor_total_homologado_ajustado || 0);
    b.itens += 1;
    b._linhas.push(r);
    if (r.numero_controle_pncp) b._contratacoes.add(r.numero_controle_pncp);
    if (r.segmento) b._segmentos.add(r.segmento);
    if (r.municipio) b._municipios.add(r.municipio);
  });
  return [...buckets.values()].map(b => ({
    ...b,
    contratacoes: b._contratacoes.size,
    segmentos_distintos: b._segmentos.size,
    municipios_distintos: b._municipios.size
  }));
}

function colunasVencedores(modo){
  const inicio = [
    {campo:"nome_fornecedor", rotulo:"Fornecedor", classe:"larga"},
    {campo:"porte_fornecedor", rotulo:"Porte"}
  ];
  const meio =
    modo === "segmento" ? [{campo:"segmento", rotulo:"Segmento"}] :
    modo === "mes" ? [
      {campo:"ano", rotulo:"Ano", classe:"num"},
      {campo:"mes", rotulo:"Mês", classe:"num",
       render:r => r.mes ? String(r.mes).padStart(2, "0") : NADA}
    ] :
    modo === "municipio" ? [{campo:"municipio", rotulo:"Município"}] : [];
  const fim = [
    {campo:"valor_total", rotulo:"Valor total", classe:"num", render:r => brl(r.valor_total)},
    {campo:"itens", rotulo:"Itens", classe:"num"},
    {campo:"contratacoes", rotulo:"Contratações", classe:"num"}
  ];
  if (modo !== "segmento") fim.push({campo:"segmentos_distintos", rotulo:"Segmentos", classe:"num"});
  if (modo !== "municipio") fim.push({campo:"municipios_distintos", rotulo:"Municípios", classe:"num"});
  return [...inicio, ...meio, ...fim];
}

function filtrosVencedores(modo){
  const f = [
    {campo:"__agrupar", rotulo:"Agrupar por", tipo:"agrupar"},
    {campo:"__busca", rotulo:"Buscar fornecedor", tipo:"texto", alvo:["nome_fornecedor"]},
    {campo:"porte_fornecedor", rotulo:"Porte"}
  ];
  if (modo === "segmento") f.push({campo:"segmento", rotulo:"Segmento"});
  if (modo === "mes") f.push({campo:"ano", rotulo:"Ano"});
  if (modo === "municipio") f.push({campo:"municipio", rotulo:"Município"});
  return f;
}

function sincronizarVencedores(){
  const modo = (estado.vencedores && estado.vencedores.__agrupar) || "geral";
  const cfg = ABAS.vencedores;
  cfg.dados = agruparVencedores(modo);
  cfg.colunas = colunasVencedores(modo);
  cfg.filtros = filtrosVencedores(modo);
}

/* --------------------------------------------------------------- estado */
let abaAtual = "radar";
let estado = {};                       // filtros por aba: {aba: {campo: valor}}
let ordem = {};                        // ordenação por aba
let expandidos = {};                   // linhas abertas por aba: {aba: Set(chave)}

Object.keys(ABAS).forEach(k => {
  estado[k] = {}; ordem[k] = {...ABAS[k].ordem}; expandidos[k] = new Set();
});

const valorDe = (linha, coluna) => coluna.valor ? coluna.valor(linha) : linha[coluna.campo];

function aplicar(aba){
  const cfg = ABAS[aba];
  const f = estado[aba];
  return cfg.dados.filter(linha => cfg.filtros.every(filtro => {
    const escolhido = f[filtro.campo];
    if (escolhido === undefined || escolhido === "" || escolhido === null) return true;

    // "agrupar" já reformou cfg.dados inteiro (ver sincronizarVencedores); não
    // é um predicado por linha, filtrar por ele aqui zeraria a tabela.
    if (filtro.tipo === "agrupar") return true;
    if (filtro.tipo === "texto"){
      const alvo = filtro.alvo.map(c => String(linha[c] ?? "")).join(" ").toLowerCase();
      return escolhido.toLowerCase().split(/\s+/).every(t => alvo.includes(t));
    }
    if (filtro.tipo === "minimo") return Number(linha[filtro.alvo] ?? -Infinity) >= Number(escolhido);
    if (filtro.tipo === "prazo"){
      const p = prazo(linha.data_encerramento_proposta);
      if (p === null) return false;
      if (escolhido === "aberto") return p >= 0;
      if (escolhido === "7") return p >= 0 && p <= 7;
      if (escolhido === "15") return p >= 0 && p <= 15;
      if (escolhido === "encerrado") return p < 0;
      return true;
    }
    return String(linha[filtro.campo] ?? "") === String(escolhido);
  }));
}

function ordenar(linhas, aba){
  const o = ordem[aba];
  if (!o || !o.campo) return linhas;
  const coluna = ABAS[aba].colunas.find(c => c.campo === o.campo) || {campo:o.campo};
  return [...linhas].sort((a, b) => {
    let x = valorDe(a, coluna), y = valorDe(b, coluna);
    // Sem dado vai sempre para o fim, independente da direção da ordenação.
    const vazio = v => v === null || v === undefined || v === "";
    if (vazio(x) && vazio(y)) return 0;
    if (vazio(x)) return 1;
    if (vazio(y)) return -1;
    if (typeof x === "number" && typeof y === "number") return o.desc ? y - x : x - y;
    x = String(x); y = String(y);
    return o.desc ? y.localeCompare(x, "pt-BR") : x.localeCompare(y, "pt-BR");
  });
}

/* -------------------------------------------------------------- desenho */
function desenharFiltros(){
  const cfg = ABAS[abaAtual];
  const alvo = document.getElementById("filtros");
  alvo.innerHTML = "";

  cfg.filtros.forEach(filtro => {
    const bloco = document.createElement("div");
    const id = "f_" + filtro.campo;
    let campo;

    if (filtro.tipo === "texto"){
      campo = `<input id="${id}" type="search" placeholder="digite para filtrar"
               value="${esc(estado[abaAtual][filtro.campo] ?? "")}">`;
    } else if (filtro.tipo === "minimo"){
      campo = `<input id="${id}" type="number" min="0" max="100" step="5" placeholder="0"
               value="${esc(estado[abaAtual][filtro.campo] ?? "")}">`;
    } else if (filtro.tipo === "prazo"){
      const sel = estado[abaAtual][filtro.campo] ?? "";
      const ops = [["","todos"],["aberto","em aberto"],["7","até 7 dias"],
                   ["15","até 15 dias"],["encerrado","já encerrado"]];
      campo = `<select id="${id}">` + ops.map(([v,r]) =>
        `<option value="${v}"${v === sel ? " selected" : ""}>${r}</option>`).join("") + `</select>`;
    } else if (filtro.tipo === "agrupar"){
      const sel = estado[abaAtual][filtro.campo] ?? "geral";
      campo = `<select id="${id}">` + AGRUPAMENTOS_VENCEDOR.map(([v,r]) =>
        `<option value="${v}"${v === sel ? " selected" : ""}>${r}</option>`).join("") + `</select>`;
    } else {
      const vistos = new Map();
      cfg.dados.forEach(l => {
        const v = l[filtro.campo];
        if (v === null || v === undefined || v === "") return;
        vistos.set(String(v), (vistos.get(String(v)) || 0) + 1);
      });
      const rotulo = v => filtro.mapa ? (filtro.mapa[v] ?? v) : v;
      const opcoes = [...vistos.entries()]
        .sort((a, b) => String(rotulo(a[0])).localeCompare(String(rotulo(b[0])), "pt-BR"));
      const sel = estado[abaAtual][filtro.campo] ?? "";
      campo = `<select id="${id}"><option value="">todos</option>`
        + opcoes.map(([v, n]) =>
            `<option value="${esc(v)}"${v === sel ? " selected" : ""}>${esc(rotulo(v))} (${n})</option>`
          ).join("") + `</select>`;
    }

    bloco.innerHTML = `<label for="${id}">${esc(filtro.rotulo)}${termoAjudaHtml(filtro.campo)}</label>${campo}`;
    alvo.appendChild(bloco);
    ligarAjudaBotoes(bloco);

    const elemento = bloco.querySelector("#" + CSS.escape(id));
    const evento = (filtro.tipo === "texto" || filtro.tipo === "minimo") ? "input" : "change";
    elemento.addEventListener(evento, e => {
      estado[abaAtual][filtro.campo] = e.target.value;
      // Mudar o agrupamento reformula cfg.dados/colunas antes de desenhar —
      // sem isto a tabela mostraria colunas de um modo com dados de outro.
      if (filtro.tipo === "agrupar" && cfg.aoAgrupar) cfg.aoAgrupar();
      desenharTabela();
      if (evento === "change") desenharFiltros();
    });
  });
}

function desenharTabela(){
  const cfg = ABAS[abaAtual];
  const linhas = ordenar(aplicar(abaAtual), abaAtual);

  const cabecalho = document.getElementById("cabecalho");
  cabecalho.innerHTML = "<tr>" + cfg.colunas.map(c => {
    const o = ordem[abaAtual];
    const seta = o.campo === c.campo ? (o.desc ? " ↓" : " ↑") : "";
    const entrada = GLOSSARIO[c.campo];
    const tituloAttr = entrada ? ` title="${esc(entrada.explicacao)}"` : "";
    return `<th data-campo="${esc(c.campo)}"${tituloAttr}>${esc(c.rotulo)}${seta}`
         + `${termoAjudaHtml(c.campo)}</th>`;
  }).join("") + "</tr>";
  ligarAjudaBotoes(cabecalho);

  document.querySelectorAll("#cabecalho th").forEach(th => {
    th.addEventListener("click", () => {
      const campo = th.dataset.campo;
      const o = ordem[abaAtual];
      ordem[abaAtual] = {campo, desc: o.campo === campo ? !o.desc : true};
      desenharTabela();
    });
  });

  const exp = cfg.expandir;
  const abertos = expandidos[abaAtual];

  document.getElementById("corpo").innerHTML = linhas.map(l => {
    const chave = exp ? String(exp.chave(l)) : null;
    const aberta = exp && abertos.has(chave);
    const classes = [exp ? "expansivel" : "", aberta ? "aberta" : ""].filter(Boolean).join(" ");
    const principal = `<tr${classes ? ` class="${classes}"` : ""}${chave ? ` data-chave="${esc(chave)}"` : ""}>`
      + cfg.colunas.map(c => {
          const conteudo = c.render ? c.render(l) : esc(l[c.campo] ?? NADA);
          return `<td class="${c.classe || ""}">${conteudo}</td>`;
        }).join("")
      + "</tr>";
    if (!aberta) return principal;
    return principal
      + `<tr class="linha-detalhe" data-chave-detalhe="${esc(chave)}">`
      + `<td colspan="${cfg.colunas.length}">${renderizarDetalhe(cfg, abaAtual, l, chave)}</td></tr>`;
  }).join("");

  if (exp){
    document.querySelectorAll("#corpo tr.expansivel").forEach(tr => {
      tr.addEventListener("click", e => {
        if (e.target.closest("a")) return;   // clique num link não alterna a linha
        const chave = tr.dataset.chave;
        if (abertos.has(chave)) abertos.delete(chave); else abertos.add(chave);
        desenharTabela();
      });
    });
    document.querySelectorAll("#corpo tr.linha-detalhe").forEach(tr => {
      ligarEventosDetalhe(cfg, abaAtual, tr.dataset.chaveDetalhe, tr);
    });
  }

  document.getElementById("vazio").hidden = linhas.length > 0;
  document.getElementById("contagem").textContent =
    `${linhas.length.toLocaleString("pt-BR")} de ${cfg.dados.length.toLocaleString("pt-BR")} registros`;
}

function desenharAba(){
  document.querySelectorAll("#abas button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.aba === abaAtual)));
  const cfg = ABAS[abaAtual];
  if (cfg.aoAgrupar) cfg.aoAgrupar();   // reconstrói dados/colunas da aba Vencedores
  const aviso = document.getElementById("aviso");
  aviso.textContent = cfg.nota || "";
  aviso.hidden = !cfg.nota;
  desenharFiltros();
  desenharTabela();
}

/* --------------------------------------------------------------- ações */
document.querySelectorAll("#abas button").forEach(b =>
  b.addEventListener("click", () => { abaAtual = b.dataset.aba; desenharAba(); }));

document.getElementById("limpar").addEventListener("click", () => {
  estado[abaAtual] = {};
  desenharAba();
});

document.getElementById("baixar").addEventListener("click", () => {
  const cfg = ABAS[abaAtual];
  const linhas = ordenar(aplicar(abaAtual), abaAtual);
  const campos = cfg.colunas.map(c => c.campo).filter(c => !c.startsWith("__"));
  const escapaCsv = v => {
    const s = String(v ?? "");
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = [campos.join(";")]
    .concat(linhas.map(l => campos.map(c => escapaCsv(l[c])).join(";")))
    .join("\n");
  // BOM para o Excel pt-BR reconhecer UTF-8.
  const blob = new Blob(["﻿" + csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `licitacoes_${abaAtual}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
});

/* ---------------------------------------------------------------- carga */
document.getElementById("carimbo").textContent = D.gerado_em
  ? "Atualizado em " + dia(D.gerado_em) + " · dados do PNCP"
  : "Sem dados carregados";

const T = D.totais || {};
document.getElementById("totais").innerHTML = [
  ["Municípios", T.municipios], ["Contratações", T.contratacoes],
  ["Itens", T.itens], ["Fornecedores", T.fornecedores]
].map(([r, v]) => `<div class="total"><b>${nums(v ?? 0)}</b><span>${r}</span></div>`).join("");

/* Lista completa do glossário: cobre também os termos sem coluna própria
   (dispensa, inexigibilidade, credenciamento, taxa de deserção...), que o
   tooltip por cabeçalho sozinho não alcançaria. */
document.getElementById("glossario-lista").innerHTML = Object.values(GLOSSARIO)
  .sort((a, b) => a.termo.localeCompare(b.termo, "pt-BR"))
  .map(e => `<dt>${esc(e.termo)}</dt><dd>${esc(e.explicacao)}</dd>`)
  .join("");

const painelGlossario = document.getElementById("glossario-painel");
document.getElementById("glossario-abrir").addEventListener("click", () => {
  painelGlossario.hidden = false;
});
document.getElementById("glossario-fechar").addEventListener("click", () => {
  painelGlossario.hidden = true;
});

desenharAba();
</script>
</body>
</html>
